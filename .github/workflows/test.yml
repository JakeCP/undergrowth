name: tests + typecheck

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Tests
        run: node --test
      - name: Typecheck
        run: npx tsc -p jsconfig.json
